<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;overflow:hidden}
.i{position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,#3a2f12,#0f1218 70%);display:grid;place-items:center}
.f{position:absolute;bottom:0;left:0;right:0;height:46%;background:repeating-linear-gradient(90deg,#ffc928 0 34px,#e0a91a 34px 40px);clip-path:polygon(0 30%,100% 0,100% 100%,0 100%)}
.f2{position:absolute;bottom:0;left:0;right:0;height:30%;background:repeating-linear-gradient(90deg,#22c55e 0 34px,#16a34a 34px 40px);clip-path:polygon(0 20%,100% 45%,100% 100%,0 100%)}
.e{position:absolute;top:70px;font-size:210px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
</style></head><body><div class="i"><div class="f"></div><div class="f2"></div><div class="e">🌽</div></div></body></html>
