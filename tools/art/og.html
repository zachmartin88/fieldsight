<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;background:#0f1218;color:#fff}
.bg{position:absolute;inset:0;background:
 radial-gradient(circle at 82% 22%, rgba(255,201,40,.55), transparent 42%),
 radial-gradient(circle at 70% 85%, rgba(34,197,94,.45), transparent 40%),
 radial-gradient(circle at 98% 60%, rgba(244,114,182,.35), transparent 35%)}
.rows{position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(255,255,255,.06) 0 3px, transparent 3px 40px)}
.patch{position:absolute;right:60px;top:70px;width:470px;height:470px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;transform:rotate(-8deg)}
.patch i{border-radius:22px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55), 0 10px 30px rgba(0,0,0,.35);display:grid;place-items:center;font-style:normal;font-size:46px}
.c{background:#ffc928}.s{background:#22c55e}.w{background:#fb7a24}.h{background:#a78bfa}.t{background:#f472b6}.r{background:#38bdf8}
.left{position:absolute;left:70px;top:56px;width:560px}
.logo{display:flex;align-items:center;gap:16px;font-weight:900;font-size:40px;color:#e8c170}
.logo b{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:#e8c170;font-size:38px}
h1{font-size:72px;line-height:1.02;font-weight:900;letter-spacing:-.02em;margin:36px 0 18px}
p{font-size:28px;line-height:1.35;color:rgba(255,255,255,.82);margin:0;font-weight:600}
.pills{display:flex;gap:12px;margin-top:34px}
.pills span{padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2);font-size:22px;font-weight:800}
</style></head><body><div class="bg"></div><div class="rows"></div>
<div class="patch">
<i class="c">🌽</i><i class="s">🫘</i><i class="c">🌽</i><i class="w">🌾</i>
<i class="s">🫘</i><i class="c">🌽</i><i class="h">🌿</i><i class="s">🫘</i>
<i class="w">🌾</i><i class="t">☁️</i><i class="c">🌽</i><i class="r">🍚</i>
<i class="c">🌽</i><i class="s">🫘</i><i class="w">🌾</i><i class="c">🌽</i></div>
<div class="left"><div class="logo"><b>🌾</b>FieldSight</div>
<h1>What’s growing beside the road?</h1>
<p>See what’s growing in the fields you drive past, from this season’s satellite crop map.</p>
<div class="pills"><span>🃏 Collect crops</span><span>🎯 Road bingo</span></div></div>
</body></html>
